<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Sa'eed Telvari | Reservoir Simulation & CCUS Researcher</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="./colors_and_type.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="icon" href="./assets/logo-minimalist.png">
  <script>window.__pageLoadStart = Date.now();</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #211d34 0%, #1c2645 50%, #1d416e 100%);
      font-family: 'Montserrat', system-ui, sans-serif;
      overflow-x: hidden;
    }
    /* Scrollbar style to match */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.20); }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(100,255,218,0.30), rgba(100,255,218,0.10)); border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100,255,218,0.40); }

    /* App Loader — 0ms Instant Native Pre-React Layer */
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0e0a17;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', system-ui, sans-serif;
      color: #fff;
      transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    #app-loader.loader-finished {
      opacity: 0;
      transform: scale(1.025);
      pointer-events: none;
    }

    .loader-bg {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 45%, rgba(13, 252, 162, 0.12) 0%, rgba(15, 52, 96, 0.18) 45%, transparent 70%),
        linear-gradient(180deg, #150f24 0%, #0c0814 100%);
      pointer-events: none;
    }

    .loader-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 480px;
      width: 90%;
      padding: 20px;
    }

    /* Seismic Sonar Radar Pulse */
    .seismic-scanner {
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    .seismic-ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(13, 252, 162, 0.6);
      box-shadow: 0 0 14px rgba(13, 252, 162, 0.35);
      animation: seismicWave 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }

    .ring-1 { width: 40px; height: 40px; animation-delay: 0s; }
    .ring-2 { width: 70px; height: 70px; animation-delay: 0.7s; }
    .ring-3 { width: 100px; height: 100px; animation-delay: 1.4s; }

    @keyframes seismicWave {
      0% { transform: scale(0.35); opacity: 0.9; }
      60% { opacity: 0.4; }
      100% { transform: scale(1.45); opacity: 0; }
    }

    .seismic-beacon {
      position: relative;
      z-index: 3;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(19, 13, 28, 0.92);
      border: 1px solid rgba(13, 252, 162, 0.8);
      box-shadow: 0 0 20px rgba(13, 252, 162, 0.5), inset 0 0 10px rgba(13, 252, 162, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: beaconPulse 1.8s ease-in-out infinite alternate;
    }

    @keyframes beaconPulse {
      0% { transform: scale(0.95); box-shadow: 0 0 12px rgba(13, 252, 162, 0.4); }
      100% { transform: scale(1.05); box-shadow: 0 0 24px rgba(13, 252, 162, 0.7); }
    }

    /* Header Typography */
    .loader-header {
      margin-bottom: 24px;
    }

    .loader-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.32em;
      color: #ffffff;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .loader-subtitle {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.18em;
      color: rgba(100, 255, 218, 0.8);
      text-transform: uppercase;
      font-family: ui-monospace, Menlo, Monaco, monospace;
    }

    /* Precision Neon Progress Track */
    .loader-progress-track {
      width: 280px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      margin-bottom: 18px;
    }

    .loader-progress-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, #1a8e8f, #20c997, #0dfca2);
      box-shadow: 0 0 10px rgba(13, 252, 162, 0.8);
      animation: loaderProgress 1.45s cubic-bezier(0.16, 0.8, 0.25, 1) forwards;
    }

    @keyframes loaderProgress {
      0% { width: 4%; }
      25% { width: 32%; }
      55% { width: 68%; }
      85% { width: 92%; }
      100% { width: 100%; }
    }

    /* Live Telemetry Cycling Stream */
    .loader-telemetry {
      height: 20px;
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .telemetry-item {
      position: absolute;
      font-size: 11px;
      font-family: ui-monospace, Menlo, Monaco, monospace;
      color: rgba(255, 255, 255, 0.85);
      letter-spacing: 0.08em;
      opacity: 0;
      transform: translateY(6px);
      white-space: nowrap;
    }

    .telemetry-tag {
      color: #0dfca2;
      font-weight: 600;
      margin-right: 4px;
    }

    .step-1 { animation: teleStep1 1.55s ease forwards; }
    .step-2 { animation: teleStep2 1.55s ease forwards; }
    .step-3 { animation: teleStep3 1.55s ease forwards; }
    .step-4 { animation: teleStep4 1.55s ease forwards; }

    @keyframes teleStep1 {
      0% { opacity: 0; transform: translateY(6px); }
      6%, 22% { opacity: 1; transform: translateY(0); }
      26%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    @keyframes teleStep2 {
      0%, 25% { opacity: 0; transform: translateY(6px); }
      31%, 48% { opacity: 1; transform: translateY(0); }
      52%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    @keyframes teleStep3 {
      0%, 51% { opacity: 0; transform: translateY(6px); }
      57%, 74% { opacity: 1; transform: translateY(0); }
      78%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    @keyframes teleStep4 {
      0%, 77% { opacity: 0; transform: translateY(6px); }
      83%, 100% { opacity: 1; transform: translateY(0); }
    }

    /* Subsurface hero animations — defined globally so React re-renders can't reset them */
    @keyframes twinkle {
      0%, 100% { opacity: 0.25; }
      50%      { opacity: 0.95; }
    }
    @keyframes flow {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -160; }
    }
    @keyframes flow-reverse {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: 160; }
    }
    @keyframes fingerDrip {
      0%   { transform: translateY(0) scale(1);      opacity: 0; }
      15%  {                                         opacity: 0.55; }
      85%  { transform: translateY(120px) scale(1.3); opacity: 0.30; }
      100% { transform: translateY(140px) scale(0.3); opacity: 0; }
    }
    @keyframes cellPulse {
      0%, 100% { opacity: 0.15; transform: scale(0.85); }
      50%      { opacity: 0.95; transform: scale(1.25); }
    }
    @keyframes bubbleRise {
      0%   { transform: translate(0, 0)               scale(0.5); opacity: 0; }
      15%  { transform: translate(calc(var(--drift, 0px) * 0.10), -30px)  scale(0.85); opacity: 0.85; }
      55%  { transform: translate(calc(var(--drift, 0px) * 0.50), -160px) scale(1);    opacity: 0.75; }
      85%  { transform: translate(calc(var(--drift, 0px) * 0.85), -260px) scale(1.05); opacity: 0.40; }
      100% { transform: translate(var(--drift, 0px),              -330px) scale(1.1);  opacity: 0;    }
    }
    @keyframes streakRise {
      0%   { transform: translateY(0);      opacity: 0; }
      15%  {                                opacity: 0.75; }
      85%  { transform: translateY(-180px); opacity: 0.45; }
      100% { transform: translateY(-200px); opacity: 0; }
    }
    @keyframes faultRise {
      0%   { transform: translate(0, 0) scale(0.8); opacity: 0; }
      15%  { opacity: 0.95; transform: translate(calc(var(--travel-x, 0px) * 0.15), calc(var(--travel-y, -120px) * 0.15)) scale(0.9); }
      85%  { opacity: 0.95; transform: translate(calc(var(--travel-x, 0px) * 0.85), calc(var(--travel-y, -120px) * 0.85)) scale(1.0); }
      100% { transform: translate(var(--travel-x, 0px), var(--travel-y, -120px)) scale(1.2); opacity: 0; }
    }
    @keyframes faultRiseTilted {
      0%   { transform: translate(0, 0) scale(0.8); opacity: 0; }
      15%  { opacity: 0.95; transform: translate(calc(var(--travel-x, 0px) * 0.15), calc(var(--travel-y, -120px) * 0.15)) scale(0.9); }
      85%  { opacity: 0.95; transform: translate(calc(var(--travel-x, 0px) * 0.85), calc(var(--travel-y, -120px) * 0.85)) scale(1.0); }
      100% { transform: translate(var(--travel-x, 0px), var(--travel-y, -120px)) scale(1.2); opacity: 0; }
    }
    @keyframes conduitFlow {
      0%   { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes dischargePulse {
      0%   { transform: scale(0.6); opacity: 0.8; }
      50%  { transform: scale(1.5); opacity: 0.3; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    @keyframes pulseFlare {
      0%, 100% { opacity: 0.65; transform: translateX(-50%) scale(1);   }
      50%      { opacity: 1;    transform: translateX(-50%) scale(1.4); }
    }
    @keyframes labelArrow {
      0%, 100% { opacity: 0.65; }
      50%      { opacity: 1; }
    }
    @keyframes feedBubble {
      0%   { transform: translateY(0); opacity: 0; }
      15%  { opacity: 0.85; }
      85%  { opacity: 0.85; }
      100% { transform: translateY(calc(42vh - 35px)); opacity: 0; }
    }
    @keyframes plumePulse {
      0%, 100% { opacity: 0.22; transform: scale(1.0); }
      50%      { opacity: 0.45; transform: scale(1.01); }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
</head>

  <script src="bundle.js?v=12.0"></script>
