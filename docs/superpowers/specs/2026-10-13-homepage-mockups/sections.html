<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sections mockup</title>
<!-- Static mockup for the 2026-10-13 homepage spec. #a = tuned cutaway (recommended), #b = lithology log track. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Open+Sans:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root { --bg: #120e0b; --surface: #1a1511; --surface-2: #221c17; --rule: #352b23; --ink: #f4ede3; --muted: #bcae9c; --faint: #8d7f6e; --accent: #e8a15a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.7 'Open Sans', system-ui, sans-serif; }
  .rock { position: relative; padding: 96px 24px 64px; }
  .beds { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
  .bed { position: absolute; left: -2%; width: 104%; background-size: 420px; }
  .beds::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(18,14,11,.55), rgba(18,14,11,.7) 20%, rgba(18,14,11,.7) 80%, rgba(18,14,11,.55)); }
  .sheet { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto 72px; background: rgba(26,21,17,.94); border: 1px solid var(--rule); border-radius: 14px; padding: 44px 48px; }
  h2 { font: 700 30px/1.2 'Montserrat'; margin: 0 0 22px; letter-spacing: -.01em; }
  h3 { font: 700 15px/1.35 'Montserrat'; margin: 26px 0 8px; color: var(--ink); }
  .grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 44px; }
  .lead { font-size: 18px; line-height: 1.65; margin: 0 0 14px; }
  p { margin: 0 0 12px; color: rgba(244,237,227,.86); max-width: 68ch; }
  dl { margin: 0; } dt { font-weight: 600; margin-top: 12px; } dd { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
  .act { border-left: 1px solid var(--rule); padding-left: 28px; }
  .act ol { list-style: none; padding: 0; margin: 0; }
  .act li { padding: 0 0 18px; }
  .act time { font: 500 12.5px 'JetBrains Mono'; color: var(--muted); display: block; }
  .act b { display: block; font-size: 15px; } .act span { font-size: 14px; color: var(--muted); line-height: 1.6; display: block; }
  .proj { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: center; }
  .shot { aspect-ratio: 16 / 9; border-radius: 10px; border: 1px solid var(--rule); background: radial-gradient(ellipse at 60% 50%, rgba(56,232,209,.55), rgba(0,163,146,.25) 30%, transparent 46%), linear-gradient(135deg, #8b7157, #59402e 60%, #2a140a); }
  .links a { color: var(--accent); font-weight: 600; text-decoration: none; margin-right: 18px; }
  /* Variant B: log track */
  .log { display: grid; grid-template-columns: 116px 1fr; }
  .track { position: relative; border-right: 1px solid var(--rule); }
  .track .bed { left: 0; width: 72px; }
  .track .tick { position: absolute; left: 78px; font: 500 12px 'JetBrains Mono'; color: var(--faint); }
  .plain { padding: 96px 56px 64px; } .plain .sheet { background: none; border: 0; padding: 0 0 48px; border-bottom: 1px solid var(--rule); border-radius: 0; margin-bottom: 56px; max-width: 1080px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const v = (location.hash || '#a').slice(1);
  const mats = ['shale', 'sandstone', 'siltstone', 'limestone', 'shale', 'sandstone', 'dolomite', 'shale', 'siltstone', 'sandstone', 'limestone', 'shale', 'sandstone'];
  const beds = (h, w) => { let y = 0, out = ''; mats.forEach((m, i) => { const t = 70 + (i * 53) % 120; out += `<div class="bed" style="top:${y}px;height:${t + 2}px;${w ? `width:${w}px;` : ''}background-image:url(/assets/geology-${m}.webp)"></div>`; y += t; }); return out; };
  const research = `
    <section class="sheet"><h2>Research</h2><div class="grid"><div>
      <p class="lead">I’m a PhD candidate in Petroleum Engineering at Heriot-Watt University. I study how injected CO₂ migrates through depleted gas reservoirs, and how to simulate it quickly at field scale.</p>
      <p>My main tool is the vertical-equilibrium (VE) model, which assumes that CO₂, methane and brine separate vertically under buoyancy. That reduces a 3D reservoir model to 2D and makes it fast enough for screening, uncertainty quantification and optimisation studies.</p>
      <h3>Themes</h3>
      <dl><dt>VE models for depleted gas fields</dt><dd>Three-phase CO₂–methane–brine VE with a black-oil approximation, checked against compositional simulation, up to 100× faster.</dd>
      <dt>Storage screening under uncertainty</dt><dd>Ensembles of fast VE runs that test many scenarios and uncertain reservoir properties at field scale.</dd>
      <dt>Machine learning for upscaling and digital rock</dt><dd>CNNs that upscale permeability tensors and predict two-phase flow properties from micro-CT images.</dd></dl>
    </div><aside class="act"><h3 style="margin-top:0">Recent activity</h3><ol>
      <li><time>Sep 2026</time><b>InterPore UK, talk and session co-chair</b><span>A Compositional Vertical Equilibrium Model for CO₂ Storage in Depleted Gas Reservoirs.</span></li>
      <li><time>Sep 2026</time><b>Approved as MSc demonstrator</b><span>Formation Evaluation and Production Technology, from November 2026.</span></li>
      <li><time>Aug 2026</time><b>MuPSI field-scale case study</b><span>VE models of depleted gas fields, presented to the project partners.</span></li>
      <li><time>Jun 2026</time><b>Team runner-up, EAGE Energy–AI Nexus Hackathon</b><span>A Python agent that manages an energy grid under growing AI demand.</span></li>
    </ol></aside></div></section>
    <section class="sheet"><h2>Projects</h2><div class="proj"><div><h3 style="margin-top:0;font-size:19px">CO₂ storage simulator</h3><p>A vertical-equilibrium simulator of CO₂ plume migration, trapping, fault leakage and pressure build-up in a saline aquifer, with SI units, a visible mass balance and an uncertainty study.</p><p class="links"><a>Open the simulator</a><a>Read the method</a></p></div><div class="shot"></div></div></section>`;
  document.getElementById('root').innerHTML = v === 'b'
    ? `<div class="log"><div class="track">${beds(0, 72)}${[1000, 1250, 1500, 1750, 2000, 2250].map((d, i) => `<span class="tick" style="top:${80 + i * 220}px">${d}</span>`).join('')}</div><div class="plain">${research}</div></div>`
    : `<div class="rock"><div class="beds">${beds()}</div>${research}</div>`;
</script>
</body>
</html>
