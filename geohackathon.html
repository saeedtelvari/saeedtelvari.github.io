      <h1 style="font-family:Montserrat,system-ui,sans-serif">An AI agent designs a geothermal plant, and it never invents a number</h1>
      <p>Joint third place, SPE GeoHackathon 2026 (Express edition). Team Single Core: Sa'eed Telvari.</p>
      <p>The submitted plant has 2 doublets at 3.2 km, a CHP on the co-produced gas, a 33 MW backup boiler, free cooling, an aquifer cold store and a 10 MW backup chiller. It costs €36.35 per MWh, emits 4,269 t CO₂ a year and meets demand on all 365 days.</p>
      <p>Code: <a href="https://github.com/GEMINI-Digital-Twin/gemini-geothermal-suite-open/pull/68">the GEMINI pull request</a>. This page needs JavaScript for its charts.</p>
